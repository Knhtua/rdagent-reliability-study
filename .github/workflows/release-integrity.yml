name: Release integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install published Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify checksummed public artifacts
        run: python scripts/verify_public_release.py
      - name: Run public-artifact tests
        run: >-
          python -m pytest -q
          tests/test_experiment_config.py
          tests/test_calibration_threshold_outputs.py
      - name: Compile published Python sources
        run: >-
          python -m compileall -q src scripts tests
          archive/arf_v1/experiments
